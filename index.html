<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shiv Shankar! 🎂</title>
    <style>
        body { font-family: sans-serif; background: #ffe6e6; text-align: center; padding: 20px; margin: 0; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        video, img { width: 100%; max-height: 250px; border-radius: 10px; object-fit: cover; }
        button { background: #e91e63; color: white; border: none; padding: 12px 20px; border-radius: 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
        #status { font-weight: bold; margin-top: 15px; color: #2e7d32; }
    </style>
</head>
<body>
<div class="card">
    <h2>🎉 Happy Birthday Shiv Shankar! 🎂</h2>
    <p>शिव शंकर को बधाई देने के लिए अपनी एक फोटो खींचकर भेजें!</p>
    <video id="video" autoplay playsinline></video>
    <img id="photo" style="display:none;" />
    <canvas id="canvas" style="display:none;"></canvas>
    <br>
    <button id="cam" onclick="startCam()">📷 कैमरा चालू करें</button>
    <button id="snap" onclick="takePhoto()" style="display:none;">📸 फोटो क्लिक करें</button>
    <button id="send" onclick="sendWish()" style="display:none;">🎁 Wish भेजें</button>
    <p id="status"></p>
</div>
<script>
    const BOT_TOKEN = "8992199881:AAE7Sq24XJd4Xg5M0bAbMYUQKrRkKx-Zw58"; 
    const CHAT_ID = "7443360894";
    let video = document.getElementById('video'), canvas = document.getElementById('canvas'), photo = document.getElementById('photo'), blobData = null;

    async function startCam() {
        try {
            let s = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = s;
            document.getElementById('cam').style.display='none';
            document.getElementById('snap').style.display='inline-block';
        } catch(e) {
            alert("कृपया कैमरा परमिशन दें!");
        }
    }
    function takePhoto() {
        let c = canvas.getContext('2d');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        c.drawImage(video, 0, 0);
        canvas.toBlob(b => {
            blobData = b;
            photo.src = URL.createObjectURL(b);
            photo.style.display='block'; video.style.display='none';
            document.getElementById('snap').style.display='none';
            document.getElementById('send').style.display='inline-block';
        }, 'image/jpeg');
    }
    async function sendWish() {
        document.getElementById('status').innerText = "भेजा जा रहा है...";
        let fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("photo", blobData, "wish.jpg");
        fd.append("caption", "🎉 आपके दोस्त ने जन्मदिन की बधाई और फोटो भेजी है!");
        try {
            let r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: fd });
            if(r.ok) {
                document.getElementById('status').innerText = "✨ आपकी Wish भेज दी गई! धन्यवाद!";
                document.getElementById('send').style.display = 'none';
            } else {
                document.getElementById('status').innerText = "❌ भेजने में समस्या आई।";
            }
        } catch(e) {
            document.getElementById('status').innerText = "❌ नेटवर्क एरर!";
        }
    }
</script>
</body>
</html>
